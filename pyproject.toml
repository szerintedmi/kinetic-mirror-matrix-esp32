[tool.poetry]
name = "kinetic-mirror-cli"
version = "0.1.0"
description = "Python CLI tools for Kinetic Mirror ESP32 motor control"
authors = ["Petro <petro@example.com>"]
readme = "README.md"
packages = [
  { include = "mirror_cli", from = "tools" },
]

[tool.poetry.dependencies]
python = "^3.13"
pyserial = "3.5"
paho-mqtt = "2.1.0"
textual = "6.6.0"
rich = "14.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.1"
ruff = "0.14.6"

[tool.poetry.scripts]
mirror-cli = "mirror_cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
respect-gitignore = true
src = [
  "mirror_cli",
  "tools",
  "test",
]
target-version = "py39"
extend-exclude = [
  ".pio",
  ".venv",
  "data",
  "data_src",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "RUF",
]
ignore = [
  "E501",  # Existing CLI text tables exceed 100 cols intentionally
  "UP006",  # TypedDict/List upgrades handled incrementally
  "UP007",
  "UP035",
  "UP045",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["mirror_cli", "tools"]
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
indent-style = "space"
skip-magic-trailing-comma = false
quote-style = "double"
line-ending = "lf"
